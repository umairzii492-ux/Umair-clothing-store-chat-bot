<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Umair Clothing Store - Chatbot</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    @keyframes bounceDot {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-4px); opacity: 1; }
    }
    .typing-dot {
      animation: bounceDot 1.2s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-dot:nth-child(3) { animation-delay: 0.3s; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex items-center justify-center p-2 sm:p-4">

  <!-- Main Chat Card -->
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden flex flex-col h-[640px] max-h-[92vh]">

    <!-- Header -->
    <header class="bg-emerald-700 text-white px-4 py-3.5 flex items-center justify-between gap-2 shrink-0">
      <div class="flex items-center gap-3 min-w-0">
        <div id="shop-avatar" class="w-10 h-10 rounded-full bg-emerald-500/40 border border-emerald-300/40 flex items-center justify-center font-bold text-base shrink-0">
          U
        </div>
        <div class="min-w-0">
          <h1 id="shop-title" class="font-semibold text-sm sm:text-base truncate">Umair Clothing Store</h1>
          <div class="flex items-center gap-1.5 text-xs text-emerald-100">
            <span class="w-2 h-2 rounded-full bg-emerald-300 animate-pulse"></span>
            <span id="shop-tagline" class="truncate">Online • Instant Replies</span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <button id="btn-reset-chat" type="button" title="New Chat"
          class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-emerald-800/70 hover:bg-emerald-800 transition-colors">
          Reset
        </button>
        <button id="btn-open-settings" type="button" title="Customize Shop Info"
          class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-white/15 hover:bg-white/25 transition-colors flex items-center gap-1">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          Setup
        </button>
      </div>
    </header>

    <!-- Chat Area -->
    <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50">
      <!-- Messages rendered here -->
    </div>

    <!-- Quick Action Chips -->
    <div class="px-3 py-2 bg-white border-t border-slate-200 shrink-0">
      <div class="flex flex-wrap gap-1.5" id="quick-chips">
        <button type="button" data-msg="Prices aur items?" class="chip-btn px-3 py-1.5 rounded-full text-xs font-medium bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-200 transition-colors">
          Prices &amp; Items
        </button>
        <button type="button" data-msg="Shop timing kya hai?" class="chip-btn px-3 py-1.5 rounded-full text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 transition-colors">
          Timings
        </button>
        <button type="button" data-msg="Delivery details?" class="chip-btn px-3 py-1.5 rounded-full text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 transition-colors">
          Delivery
        </button>
        <button type="button" data-msg="Shop address kahan hai?" class="chip-btn px-3 py-1.5 rounded-full text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 transition-colors">
          Location
        </button>
        <button type="button" data-msg="Order kaise karoon?" class="chip-btn px-3 py-1.5 rounded-full text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 transition-colors">
          Order / WhatsApp
        </button>
      </div>
    </div>

    <!-- Input Bar -->
    <form id="chat-form" class="p-3 bg-white border-t border-slate-200 flex items-center gap-2 shrink-0">
      <input id="chat-input" type="text" autocomplete="off" placeholder="Apna sawal likhein..."
        class="flex-1 rounded-full bg-slate-100 border border-slate-200 px-4 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-emerald-600 focus:bg-white" />
      <button type="submit" aria-label="Send message"
        class="w-10 h-10 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white flex items-center justify-center transition-colors shrink-0 shadow-sm">
        <svg class="w-4 h-4 translate-x-0.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
        </svg>
      </button>
    </form>
  </div>

  <!-- Customize Shop Modal -->
  <div id="settings-modal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-3">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-md max-h-[90vh] flex flex-col overflow-hidden">
      <div class="px-5 py-3.5 border-b border-slate-200 flex items-center justify-between">
        <h2 class="font-semibold text-base text-slate-900">Customize Your Shop Bot</h2>
        <button id="btn-close-settings" type="button" class="text-slate-400 hover:text-slate-700 text-lg leading-none px-1">&times;</button>
      </div>

      <form id="settings-form" class="p-4 space-y-3 overflow-y-auto text-sm">
        <div>
          <label for="cfg-name" class="block text-xs font-medium text-slate-600 mb-1">Shop Name</label>
          <input id="cfg-name" type="text" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-emerald-600" />
        </div>
        <div>
          <label for="cfg-whatsapp" class="block text-xs font-medium text-slate-600 mb-1">WhatsApp Number (with country code, e.g. 923001234567)</label>
          <input id="cfg-whatsapp" type="text" placeholder="923001234567" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-emerald-600" />
        </div>
        <div>
          <label for="cfg-catalog" class="block text-xs font-medium text-slate-600 mb-1">Products &amp; Prices Reply</label>
          <textarea id="cfg-catalog" rows="2" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-emerald-600"></textarea>
        </div>
        <div>
          <label for="cfg-timings" class="block text-xs font-medium text-slate-600 mb-1">Shop Timings Reply</label>
          <input id="cfg-timings" type="text" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-emerald-600" />
        </div>
        <div>
          <label for="cfg-delivery" class="block text-xs font-medium text-slate-600 mb-1">Delivery Info Reply</label>
          <input id="cfg-delivery" type="text" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-emerald-600" />
        </div>
        <div>
          <label for="cfg-address" class="block text-xs font-medium text-slate-600 mb-1">Shop Address / Location Reply</label>
          <input id="cfg-address" type="text" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-emerald-600" />
        </div>

        <div class="pt-2 flex items-center justify-end gap-2">
          <button id="btn-cancel-settings" type="button" class="px-4 py-2 rounded-lg text-xs font-medium text-slate-600 hover:bg-slate-100">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded-lg text-xs font-medium bg-emerald-600 hover:bg-emerald-700 text-white">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. DEFAULT SHOP CONFIGURATION (Edit these values or use the Setup button)
    // =========================================================================
    const DEFAULT_CONFIG = {
      shopName: 'Umair Clothing Store',
      whatsappNumber: '', // e.g. '923001234567'
      catalogReply: 'Umair Clothing Store par gents aur ladies kapron ki new collection munasib prices mein available hai. Aap kis item (kurta, shirt, suit) ki price poochna chahte hain?',
      timingsReply: 'Umair Clothing Store subah 10:00 AM se shaam 9:00 PM tak khula rehta hai.',
      deliveryReply: 'Cash on Delivery (COD) poore shehar mein Rs. 200 charges ke sath 1-2 din mein available hai.',
      addressReply: 'Hamari shop Saddar, Karachi, Pakistan mein waqia hai. Shop visit karein ya order ke liye message karein.'
    };

    const STORAGE_KEY = 'umair_clothing_config_v1';

    function loadConfig() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          return { ...DEFAULT_CONFIG, ...JSON.parse(saved) };
        }
      } catch (e) {}
      return { ...DEFAULT_CONFIG };
    }

    function saveConfig(cfg) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
      } catch (e) {}
    }

    let shopConfig = loadConfig();

    // =========================================================================
    // 2. SMART KEYWORD MATCHER (English + Roman Urdu)
    // =========================================================================
    function getBotReply(rawText) {
      const text = rawText.toLowerCase().trim();

      const rules = [
        {
          keywords: ['hi', 'hello', 'hey', 'salam', 'assalam', 'aoa', 'slm'],
          reply: `Assalam-o-Alaikum! ${shopConfig.shopName} mein khush amdeed. Aap prices, timings, delivery, ya address ke baare mein pooch sakte hain.`
        },
        {
          keywords: ['price', 'rate', 'kimat', 'qeemat', 'cost', 'catalog', 'item', 'product', 'menu', 'list', 'cheez', 'kya hai'],
          reply: shopConfig.catalogReply
        },
        {
          keywords: ['time', 'timing', 'open', 'close', 'khula', 'band', 'kab', 'hours', 'waqt'],
          reply: shopConfig.timingsReply
        },
        {
          keywords: ['delivery', 'deliver', 'shipping', 'cod', 'cash', 'charge', 'charges', 'bhej', 'milega'],
          reply: shopConfig.deliveryReply
        },
        {
          keywords: ['address', 'location', 'kahan', 'kidhar', 'map', 'shop', 'dukan', 'dukaan', 'pata'],
          reply: shopConfig.addressReply
        },
        {
          keywords: ['order', 'buy', 'lena', 'kharid', 'whatsapp', 'number', 'phone', 'call', 'contact', 'rabta'],
          reply: shopConfig.whatsappNumber
            ? `Order karne ke liye neeche "Chat on WhatsApp" button par click karein ya hamare number (+${shopConfig.whatsappNumber}) par message bhejein.`
            : 'Order karne ke liye apna pasandida item, naam, aur address yahan likhein—ya Setup mein apna WhatsApp number add karein.',
          showWhatsAppButton: Boolean(shopConfig.whatsappNumber)
        },
        {
          keywords: ['thank', 'thanks', 'shukriya', 'shukria', 'jazakallah', 'bye', 'allah hafiz', 'khuda hafiz'],
          reply: 'Bohat shukriya! Kisi bhi waqt zaroorat ho toh dobara message karein. Allah Hafiz!'
        }
      ];

      for (const rule of rules) {
        if (rule.keywords.some(kw => text.includes(kw))) {
          return {
            text: rule.reply,
            showWhatsAppButton: Boolean(rule.showWhatsAppButton)
          };
        }
      }

      return {
        text: 'Maaf kijiye, main yeh sawal samajh nahi saka. Aap "Prices", "Timings", "Delivery", "Location", ya "Order" ke baare mein pooch sakte hain.',
        showWhatsAppButton: Boolean(shopConfig.whatsappNumber)
      };
    }

    // =========================================================================
    // 3. UI RENDERING & INTERACTIONS
    // =========================================================================
    const chatBoxEl = document.getElementById('chat-box');
    const chatFormEl = document.getElementById('chat-form');
    const chatInputEl = document.getElementById('chat-input');
    const settingsModalEl = document.getElementById('settings-modal');

    function updateHeader() {
      document.getElementById('shop-title').textContent = shopConfig.shopName || 'Shop Assistant';
      const initial = (shopConfig.shopName || 'S').trim().charAt(0).toUpperCase();
      document.getElementById('shop-avatar').textContent = initial;
    }

    function appendMessage(role, text, showWhatsAppButton = false) {
      const row = document.createElement('div');
      row.className = role === 'user' ? 'flex justify-end' : 'flex justify-start';

      const bubble = document.createElement('div');
      bubble.className = role === 'user'
        ? 'max-w-[82%] rounded-2xl rounded-br-sm bg-emerald-600 text-white px-3.5 py-2.5 text-sm shadow-xs'
        : 'max-w-[85%] rounded-2xl rounded-bl-sm bg-white text-slate-800 border border-slate-200 px-3.5 py-2.5 text-sm shadow-xs';

      const p = document.createElement('p');
      p.textContent = text;
      bubble.appendChild(p);

      if (showWhatsAppButton && shopConfig.whatsappNumber) {
        const cleanNum = shopConfig.whatsappNumber.replace(/[^0-9]/g, '');
        if (cleanNum) {
          const link = document.createElement('a');
          link.href = `https://wa.me/${cleanNum}`;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.className = 'mt-2 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium transition-colors';
          link.textContent = 'Chat on WhatsApp';
          bubble.appendChild(link);
        }
      }

      row.appendChild(bubble);
      chatBoxEl.appendChild(row);
      chatBoxEl.scrollTop = chatBoxEl.scrollHeight;
    }

    function showTypingIndicator() {
      const row = document.createElement('div');
      row.id = 'typing-indicator';
      row.className = 'flex justify-start';
      row.innerHTML = `
        <div class="rounded-2xl rounded-bl-sm bg-white border border-slate-200 px-3.5 py-3 flex items-center gap-1.5 shadow-xs">
          <span class="w-1.5 h-1.5 rounded-full bg-slate-400 typing-dot"></span>
          <span class="w-1.5 h-1.5 rounded-full bg-slate-400 typing-dot"></span>
          <span class="w-1.5 h-1.5 rounded-full bg-slate-400 typing-dot"></span>
        </div>
      `;
      chatBoxEl.appendChild(row);
      chatBoxEl.scrollTop = chatBoxEl.scrollHeight;
    }

    function removeTypingIndicator() {
      const el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    function initChat() {
      chatBoxEl.innerHTML = '';
      appendMessage(
        'bot',
        `Assalam-o-Alaikum! ${shopConfig.shopName} mein khush amdeed. Neeche buttons par click karein ya apna sawal likhein.`
      );
    }

    let replyTimer = null;

    function sendUserMessage(text) {
      const trimmed = text.trim();
      if (!trimmed) return;

      appendMessage('user', trimmed);
      chatInputEl.value = '';

      if (replyTimer) clearTimeout(replyTimer);
      removeTypingIndicator();
      showTypingIndicator();

      replyTimer = setTimeout(() => {
        removeTypingIndicator();
        const res = getBotReply(trimmed);
        appendMessage('bot', res.text, res.showWhatsAppButton);
      }, 320);
    }

    // Event listeners
    chatFormEl.addEventListener('submit', (e) => {
      e.preventDefault();
      sendUserMessage(chatInputEl.value);
    });

    document.querySelectorAll('.chip-btn').forEach(btn => {
      btn.addEventListener('click', () => sendUserMessage(btn.dataset.msg));
    });

    document.getElementById('btn-reset-chat').addEventListener('click', initChat);

    // Settings Modal
    function openSettings() {
      document.getElementById('cfg-name').value = shopConfig.shopName;
      document.getElementById('cfg-whatsapp').value = shopConfig.whatsappNumber;
      document.getElementById('cfg-catalog').value = shopConfig.catalogReply;
      document.getElementById('cfg-timings').value = shopConfig.timingsReply;
      document.getElementById('cfg-delivery').value = shopConfig.deliveryReply;
      document.getElementById('cfg-address').value = shopConfig.addressReply;
      settingsModalEl.classList.remove('hidden');
    }

    function closeSettings() {
      settingsModalEl.classList.add('hidden');
    }

    document.getElementById('btn-open-settings').addEventListener('click', openSettings);
    document.getElementById('btn-close-settings').addEventListener('click', closeSettings);
    document.getElementById('btn-cancel-settings').addEventListener('click', closeSettings);

    document.getElementById('settings-form').addEventListener('submit', (e) => {
      e.preventDefault();
      shopConfig = {
        shopName: document.getElementById('cfg-name').value.trim() || DEFAULT_CONFIG.shopName,
        whatsappNumber: document.getElementById('cfg-whatsapp').value.trim(),
        catalogReply: document.getElementById('cfg-catalog').value.trim() || DEFAULT_CONFIG.catalogReply,
        timingsReply: document.getElementById('cfg-timings').value.trim() || DEFAULT_CONFIG.timingsReply,
        deliveryReply: document.getElementById('cfg-delivery').value.trim() || DEFAULT_CONFIG.deliveryReply,
        addressReply: document.getElementById('cfg-address').value.trim() || DEFAULT_CONFIG.addressReply
      };
      saveConfig(shopConfig);
      updateHeader();
      closeSettings();
      initChat();
    });

    // Start
    updateHeader();
    initChat();
  </script>
</body>
</html>
